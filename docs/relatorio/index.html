<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Diagnóstico da suíte E2E</title>
<style>
:root {
  color-scheme: light;
  --page: #f9f9f7; --surface: #fcfcfb; --surface-2: #f2f1ed;
  --ink: #0b0b0b; --ink-2: #52514e; --muted: #6f6d68;
  --grid: #e1e0d9; --axis: #c3c2b7; --ring: rgba(11,11,11,0.10);
  --series-1: #2a78d6; --series-1-soft: #cde2fb;
  --good: #0ca30c; --good-ink: #006300; --good-soft: #e3f4e3;
  --warning: #fab219; --warning-ink: #8a5a00; --warning-soft: #fdf1d6;
  --critical: #d03b3b; --critical-ink: #a32626; --critical-soft: #f9e1e1;
  --accent: #2a78d6;
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --surface-2: #232321;
    --ink: #f0efec; --ink-2: #c3c2b7; --muted: #9a988f;
    --grid: #2c2c2a; --axis: #383835; --ring: rgba(255,255,255,0.10);
    --series-1: #3987e5; --series-1-soft: #1c3352;
    --good-ink: #0ca30c; --good-soft: #15301a;
    --warning-ink: #fab219; --warning-soft: #3a2f12;
    --critical-ink: #e66767; --critical-soft: #3d1c1c;
    --accent: #6da7ec;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0d0d0d; --surface: #1a1a19; --surface-2: #232321;
  --ink: #f0efec; --ink-2: #c3c2b7; --muted: #9a988f;
  --grid: #2c2c2a; --axis: #383835; --ring: rgba(255,255,255,0.10);
  --series-1: #3987e5; --series-1-soft: #1c3352;
  --good-ink: #0ca30c; --good-soft: #15301a;
  --warning-ink: #fab219; --warning-soft: #3a2f12;
  --critical-ink: #e66767; --critical-soft: #3d1c1c;
  --accent: #6da7ec;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--page); color: var(--ink); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
main { max-width: 1180px; margin: 0 auto; padding: 32px 24px 64px; }
h1 { font-size: 30px; line-height: 1.15; margin: 0; letter-spacing: -0.01em; }
h2 { font-size: 20px; margin: 0 0 4px; }
h3 { font-size: 15px; margin: 0; }
p { margin: 0; }
.sub { color: var(--ink-2); }
.muted { color: var(--muted); font-size: 13px; }
section { margin-top: 40px; }
.sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 14px; }
.card { background: var(--surface); border: 1px solid var(--ring); border-radius: 12px; padding: 18px 20px; }
.grid { display: grid; gap: 14px; }
.eyebrow { font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--accent); }
header.top { display: grid; grid-template-columns: 1fr auto; gap: 24px; align-items: start; }
.resumo { margin-top: 18px; font-size: 17px; line-height: 1.55; max-width: 860px; }
.theme-btn { border: 1px solid var(--ring); background: var(--surface); color: var(--ink-2); border-radius: 8px; padding: 6px 10px; font: inherit; font-size: 13px; cursor: pointer; }

/* KPIs */
.kpis { grid-template-columns: repeat(4, minmax(0, 1fr)); margin-top: 24px; }
.kpi .valor { font-size: 38px; font-weight: 700; line-height: 1.1; margin: 6px 0 2px; }
.kpi .rotulo { font-size: 13px; color: var(--ink-2); font-weight: 600; }
.status { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 999px; }
.status::before { font-weight: 700; }
.st-vermelho { background: var(--critical-soft); color: var(--critical-ink); }
.st-vermelho::before { content: "✕"; }
.st-amarelo { background: var(--warning-soft); color: var(--warning-ink); }
.st-amarelo::before { content: "!"; }
.st-verde { background: var(--good-soft); color: var(--good-ink); }
.st-verde::before { content: "✓"; }
.destaques { grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); margin-top: 14px; }
.destaque { border-left: 3px solid var(--accent); }
.destaque .valor { font-size: 24px; font-weight: 700; }
.tag { display: inline-block; font-size: 11px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; padding: 1px 6px; border-radius: 4px; border: 1px solid var(--ring); color: var(--ink-2); }
.tag.fato { background: var(--surface-2); }
.tag.inferencia { border-style: dashed; }
.ev { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; color: var(--muted); word-break: break-word; }

/* heatmap */
.heat { width: 100%; border-collapse: separate; border-spacing: 2px; font-size: 13px; }
.heat th { font-weight: 600; color: var(--muted); font-size: 12px; text-align: center; padding: 2px 0 6px; font-variant-numeric: tabular-nums; }
.heat th.nome { text-align: left; }
.heat td.nome { padding: 4px 10px 4px 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 430px; }
.heat td.nome b { font-weight: 600; }
.heat td.cel { width: 44px; height: 30px; text-align: center; border-radius: 4px; font-weight: 700; cursor: default; }
.cel.ok { background: var(--good-soft); color: var(--good-ink); }
.cel.falha { background: var(--critical); color: #fff; }
.cel:hover { outline: 2px solid var(--ink); outline-offset: -2px; }
.heat td.taxa { text-align: right; padding-left: 10px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.legenda { display: flex; gap: 16px; flex-wrap: wrap; font-size: 13px; color: var(--ink-2); margin-top: 10px; }
.legenda i { display: inline-block; width: 14px; height: 14px; border-radius: 3px; vertical-align: -2px; margin-right: 6px; }
.scroll-x { overflow-x: auto; }

/* barras */
.duo { grid-template-columns: 1.05fr 1fr; }
svg text { fill: var(--muted); font-size: 12px; font-family: inherit; }
svg .val { fill: var(--ink-2); font-weight: 600; }
.hbar { display: grid; grid-template-columns: 170px 1fr 56px; align-items: center; gap: 10px; margin: 8px 0; font-size: 13px; }
.hbar .trilho { height: 16px; background: var(--surface-2); border-radius: 0 4px 4px 0; }
.hbar .barra { height: 100%; background: var(--series-1); border-radius: 0 4px 4px 0; }
.hbar .num { text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; }
.sinais { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 14px; }
.sinais th, .sinais td { padding: 6px 8px; border-bottom: 1px solid var(--grid); text-align: center; font-variant-numeric: tabular-nums; }
.sinais th { color: var(--muted); font-weight: 600; font-size: 12px; }
.sinais td:first-child, .sinais th:first-child { text-align: left; }
.sim { color: var(--good-ink); font-weight: 700; }
.nao { color: var(--critical-ink); font-weight: 700; }

/* semáforo */
.filtros { display: flex; gap: 6px; }
.filtros button { border: 1px solid var(--ring); background: var(--surface); color: var(--ink-2); border-radius: 999px; padding: 4px 12px; font: inherit; font-size: 13px; cursor: pointer; }
.filtros button[aria-pressed="true"] { background: var(--ink); color: var(--page); border-color: var(--ink); }
.dims { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.dim { cursor: pointer; text-align: left; font: inherit; color: inherit; display: flex; flex-direction: column; gap: 8px; transition: transform .12s ease, box-shadow .12s ease; border-top: 4px solid var(--axis); }
.dim:hover { transform: translateY(-2px); box-shadow: 0 6px 18px rgba(0,0,0,0.08); }
.dim[aria-expanded="true"] { outline: 2px solid var(--accent); }
.dim.vermelho { border-top-color: var(--critical); }
.dim.amarelo { border-top-color: var(--warning); }
.dim.verde { border-top-color: var(--good); }
.dim .num { font-size: 12px; color: var(--muted); font-weight: 600; }
.dim .just { font-size: 13px; color: var(--ink-2); }
.dim .cont { font-size: 12px; color: var(--muted); margin-top: auto; }
.achados { margin-top: 14px; }
.achado { display: grid; grid-template-columns: 96px 1fr; gap: 12px; padding: 12px 0; border-top: 1px solid var(--grid); }
.achado:first-of-type { border-top: 0; }
.achado .dimnome { font-size: 12px; color: var(--muted); }

/* oportunidades */
.matriz-wrap { display: grid; grid-template-columns: 28px 1fr; grid-template-rows: 1fr 24px; gap: 6px; }
.eixo-y { writing-mode: vertical-rl; transform: rotate(180deg); text-align: center; font-size: 12px; color: var(--muted); font-weight: 600; }
.eixo-x { grid-column: 2; text-align: center; font-size: 12px; color: var(--muted); font-weight: 600; }
.matriz { display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 84px); gap: 2px; }
.matriz .q { background: var(--surface-2); border-radius: 4px; display: flex; align-items: center; justify-content: center; gap: 6px; flex-wrap: wrap; position: relative; }
.matriz .q.ouro { background: var(--good-soft); }
.matriz .q small { position: absolute; left: 6px; bottom: 4px; font-size: 11px; color: var(--muted); }
.ponto { width: 30px; height: 30px; border-radius: 50%; background: var(--series-1); color: #fff; font-weight: 700; font-size: 14px; display: grid; place-items: center; box-shadow: 0 0 0 2px var(--surface); cursor: pointer; }
.ponto:hover, .ponto.ativo { transform: scale(1.12); }
.ops { display: flex; flex-direction: column; gap: 10px; }
.op { display: grid; grid-template-columns: 34px 1fr; gap: 12px; padding: 14px 16px; }
.op.ativo { outline: 2px solid var(--accent); }
.op .n { width: 30px; height: 30px; border-radius: 50%; background: var(--series-1); color: #fff; display: grid; place-items: center; font-weight: 700; }
.op .meta { display: flex; gap: 8px; flex-wrap: wrap; margin: 6px 0; font-size: 12px; }
.op .meta span { background: var(--surface-2); border-radius: 4px; padding: 1px 8px; color: var(--ink-2); }
.op .ganho { font-weight: 600; }
.op .conta { font-size: 13px; color: var(--ink-2); margin-top: 4px; }

/* POC */
.dias { grid-template-columns: repeat(4, 1fr); counter-reset: d; }
.dia .d { font-size: 12px; font-weight: 700; color: var(--accent); text-transform: uppercase; letter-spacing: 0.05em; }
.crit { grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
.crit .de { color: var(--critical-ink); font-weight: 700; font-size: 20px; }
.crit .para { color: var(--good-ink); font-weight: 700; font-size: 20px; }
.crit .seta { color: var(--muted); margin: 0 6px; }
ul.riscos { margin: 8px 0 0; padding-left: 18px; color: var(--ink-2); }
ul.riscos li { margin: 4px 0; }
footer { margin-top: 48px; color: var(--muted); font-size: 13px; border-top: 1px solid var(--grid); padding-top: 16px; }

#tip { position: fixed; pointer-events: none; z-index: 10; max-width: 340px; background: var(--ink); color: var(--page); font-size: 12.5px; line-height: 1.4; padding: 8px 10px; border-radius: 8px; opacity: 0; transition: opacity .08s; }
#tip b { display: block; margin-bottom: 2px; }

@media (max-width: 900px) {
  .kpis, .dims { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .duo, .dias { grid-template-columns: 1fr; }
  header.top { grid-template-columns: 1fr; }
}
@media (max-width: 520px) {
  main { padding: 20px 16px 48px; }
  h1 { font-size: 24px; }
  .kpis, .dims { grid-template-columns: 1fr; }
  .hbar { grid-template-columns: 120px 1fr 48px; }
  .achado { grid-template-columns: 1fr; gap: 4px; }
}
@media print { .theme-btn, .filtros { display: none; } section { break-inside: avoid; } }
</style>
</head>

<script>
const D = {"geradoEm":"2026-10-19T17:59:57.923Z","fonte":"diagnostico.json","diag":{"resumoExecutivo":"A suíte não ficou verde em nenhuma das 8 execuções sem retry. Três testes estão quebrados de forma permanente e dois são instáveis; o retries: 2 da configuração mascara parte disso no pipeline. Mais da metade do tempo de cada execução é espera fixa (browser.pause). A causa raiz se repete: esperas fixas, estado compartilhado entre testes e seletores presos ao layout. O padrão certo já existe no repositório (page objects com data-testid), mas só 1 dos 5 specs o usa.","destaques":[{"rotulo":"Tempo em pausa fixa por execução","valor":"~22 s de 39,6 s","detalhe":"55% da duração média da execução; 25,9 s escritos, dos quais 4 s não rodam porque o teste quebra antes.","tipo":"fato","evidencia":"grep browser.pause test/specs/ · historico/metricas.json"},{"rotulo":"Seletores frágeis","valor":"10 XPath + 2 nth-child","detalhe":"O app já expõe data-testid para todos esses elementos.","tipo":"fato","evidencia":"grep \"'/html\" e nth-child em test/specs/"},{"rotulo":"Specs no padrão page object","valor":"1 de 5","detalhe":"Só fatura-antecipacao usa LoginPage e FaturaPage.","tipo":"fato","evidencia":"test/specs/fatura-antecipacao.e2e.js:1-2"}],"dimensoes":[{"nome":"Arquitetura da suíte","status":"amarelo","justificativa":"O padrão existe em test/pageobjects/, mas 4 de 5 specs o ignoram.","achados":[{"tipo":"fato","texto":"Só um spec importa page objects; os outros quatro usam $() direto com seletores inline.","evidencia":"test/specs/fatura-antecipacao.e2e.js:1-2"},{"tipo":"fato","texto":"Não há page objects para as telas de início e de cartão.","evidencia":"test/pageobjects/ (só fatura.page.js e login.page.js)"}]},{"nome":"Estabilidade","status":"vermelho","justificativa":"0/8 execuções verdes; 3 quebrados e 2 instáveis escondidos por retries: 2.","achados":[{"tipo":"fato","texto":"Login › deve exibir erro com senha invalida falhou em 4 de 8 e … com cpf vazio em 3 de 8, sempre recebendo \"Validando...\": a pausa de 1,2 s é menor que a latência máxima da API (1,6 s).","evidencia":"test/specs/login.e2e.js:16 e :25 · app/server.cjs:10-11"},{"tipo":"fato","texto":"Bloqueio de cartao › deve bloquear o cartao falhou em 8 de 8 com \"no such alert\": no WebdriverIO v9, sem listener do evento dialog, o confirm() é dispensado via WebDriver BiDi e o bloqueio nunca acontece.","evidencia":"test/specs/cartao-bloqueio.e2e.js:16 · app/public/cartao.html:28"},{"tipo":"inferencia","texto":"Com 50% de falha por tentativa, 2 retries reduzem a falha visível para ~12,5% (0,5³): o problema continua lá, só fica mais caro de ver.","evidencia":"wdio.conf.js:29-30 · historico/metricas.json"}]},{"nome":"Velocidade","status":"vermelho","justificativa":"~22 s de pausa fixa por execução e execução serial (maxInstances: 1).","achados":[{"tipo":"fato","texto":"12 chamadas de browser.pause, de 500 ms a 4.000 ms; a pausa de 3 s após o login se repete em 4 arquivos.","evidencia":"cartao-bloqueio.e2e.js:7,9,15,17 · login.e2e.js:7,16,25 · inicio.e2e.js:7,12,18 · fatura-consulta.e2e.js:7,9"},{"tipo":"fato","texto":"maxInstances: 1 faz os 5 specs rodarem em série.","evidencia":"wdio.conf.js:7"},{"tipo":"inferencia","texto":"Trocando pausas por esperas explícitas (latência média da API ≈ 0,9 s), a execução cai para ~20 s; com paralelismo, abaixo de 15 s.","evidencia":"app/server.cjs:10-11,27 · historico/execucoes.json"}]},{"nome":"Dados e ambientes","status":"vermelho","justificativa":"Estado compartilhado entre specs, sem reset, causa falha permanente.","achados":[{"tipo":"fato","texto":"Fatura - consulta › deve exibir as parcelas com opcao de antecipar falhou em 8 de 8: fatura-antecipacao roda antes (ordem alfabética) e antecipa a 1ª parcela, cujo botão some. Nenhum spec chama POST /api/reset.","evidencia":"test/specs/fatura-consulta.e2e.js:14 · test/specs/fatura-antecipacao.e2e.js:12"},{"tipo":"fato","texto":"cartao-bloqueio encadeia 3 testes: o 3º depende do 2º e falha em 8 d const maxDur = Math.max(...D.execucoes.map((e) => e.duracaoSegundos));

function graficoDuracao() {
  const W = 520, H = 230, L = 34, B = 34, T = 14, bw = (W - L - 10) / D.execucoes.length;
  const y = (v) => T + (H - T - B) * (1 - v / escalaDur);
  const media = r.duracaoMediaSegundos;
  let s = `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Duração de cada execução em segundos">`;
  for (let v = 0; v <= escalaDur; v += 10) s += `<line x1="${L}" x2="${W - 6}" y1="${y(v)}" y2="${y(v)}" stroke="var(--grid)" stroke-width="1"/><text x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${v}</text>`;
  D.execucoes.forEach((e, i) => {
    const x = L + i * bw + 3, w = bw - 6, top = y(e.duracaoSegundos), base = y(0);
    s += `<path d="M${x},${base} V${top + 4} q0,-4 4,-4 h${w - 8} q4,0 4,4 V${base} Z" fill="var(--series-1)" data-tip="<b>Execução ${e.execucao}</b>${n1(e.duracaoSegundos)} s · ${e.sucesso ? 'verde' : 'vermelha'}"/>`;
    s += `<text x="${x + w / 2}" y="${H - B + 16}" text-anchor="middle">${e.execucao}</text>`;
    s += `<text x="${x + w / 2}" y="${H - 4}" text-anchor="middle" style="fill:${e.sucesso ? 'var(--good-ink)' : 'var(--critical-ink)'};font-weight:700">${e.sucesso ? '✓' : '✕'}</text>`;
  });
  s += `<line x1="${L}" x2="${W - 6}" y1="${y(media)}" y2="${y(media)}" stroke="var(--ink)" stroke-width="1.5"/>`;
  s += `<text x="${W - 8}" y="${y(media) - 6}" text-anchor="end" class="val">média ${n1(media)} s</text>`;
  return s + '</svg>';
}

function heatmap() {
  const cab = Array.from({ length: D.runs }, (_, i) => `<th scope="col">${i + 1}</th>`).join('');
  const linhas = D.testes.map((t) => {
    const cels = Array.from({ length: D.runs }, (_, i) => {
      const c = t.runs[i];
      if (!c) return '<td class="cel"></td>';
      const tip = `<b>${esc(t.teste)} · execução ${i + 1}</b>${c.ok ? 'passou' : 'falhou'} em ${n1(c.tempo)} s${c.msg ? '<br>' + esc(c.msg) : ''}`;
      return `<td class="cel ${c.ok ? 'ok' : 'falha'}" data-tip="${esc(tip)}" aria-label="${c.ok ? 'passou' : 'falhou'}">${c.ok ? '✓' : '✕'}</td>`;
    }).join('');
    const st = t.situacao === 'quebrado' ? 'vermelho' : t.situacao === 'instável' ? 'amarelo' : 'verde';
    const [suite, nome] = t.teste.split(' › ');
    return `<tr><td class="nome" title="${esc(t.teste)}"><span class="muted">${esc(suite)} ›</span> <b>${esc(nome)}</b></td>${cels}<td class="taxa"><span class="status st-${st}">${esc(t.situacao)} · ${pct(t.taxaSucesso)}</span></td></tr>`;
  }).join('');
  return `<div class="scroll-x"><table class="heat"><thead><tr><th class="nome" scope="col">Teste</th>${cab}<th scope="col">Situação</th></tr></thead><tbody>${linhas}</tbody></table></div>
    <div class="legenda"><span><i style="background:var(--good-soft)"></i>✓ passou</span><span><i style="background:var(--critical)"></i>✕ falhou</span><span>Passe o mouse numa célula para ver a mensagem de erro.</span></div>`;
}

function pausas() {
  const barras = D.specs.map((s) => `<div class="hbar" data-tip="<b>${esc(s.arquivo)}</b>${s.qtdPausas} chamadas de browser.pause, ${n1(s.pausasMs / 1000)} s no total">
      <span>${esc(s.arquivo.replace('.e2e.js', ''))}</span><div class="trilho"><div class="barra" style="width:${(s.pausasMs / maxPausa) * 100}%"></div></div><span class="num">${n1(s.pausasMs / 1000)} s</span></div>`).join('');
  const linhas = D.specs.map((s) => `<tr><td>${esc(s.arquivo)}</td><td>${s.qtdPausas}</td><td>${s.xpath + s.nthChild}</td>
      <td class="${s.pageObject ? 'sim' : 'nao'}">${s.pageObject ? '✓ sim' : '✕ não'}</td><td class="${s.reset ? 'sim' : 'nao'}">${s.reset ? '✓ sim' : '✕ não'}</td></tr>`).join('');
  return `${barras}<table class="sinais"><thead><tr><th>Arquivo</th><th>pausas</th><th>XPath / nth-child</th><th>page object</th><th>reset de estado</th></tr></thead><tbody>${linhas}</tbody></table>`;
}

function dimensoes() {
  return d.dimensoes.map((x, i) => `<button class="card dim ${x.status}" data-dim="${i}" aria-expanded="false">
      <span class="num">${i + 1}</span><h3>${esc(x.nome)}</h3><span class="status st-${x.status}">${ROT[x.status]}</span>
      <span class="just">${esc(x.justificativa)}</span><span class="cont">${x.achados.length} achado${x.achados.length > 1 ? 's' : ''} ›</span></button>`).join('');
}

// abre na primeira dimensão crítica; "Ver todas" mostra a lista completa
let filtroTipo = 'todos', filtroDim = Math.max(0, d.dimensoes.findIndex((x) => x.status === 'vermelho'));
function listaAchados() {
  const itens = [];
  d.dimensoes.forEach((x, i) => {
    if (filtroDim !== null && filtroDim !== i) return;
    x.achados.forEach((a) => {
      if (filtroTipo !== 'todos' && a.tipo !== filtroTipo) return;
      itens.push(`<div class="achado"><div>${tipo(a.tipo)}<div class="dimnome">${i + 1} · ${esc(x.nome)}</div></div><div><p>${esc(a.texto)}</p><p class="ev">${esc(a.evidencia)}</p></div></div>`);
    });
  });
  const titulo = filtroDim === null ? 'Todos os achados' : `Achados · ${esc(d.dimensoes[filtroDim].nome)}`;
  $('#achados').innerHTML = `<div class="sec-head"><h3>${titulo} <span class="muted">(${itens.length})</span></h3>${filtroDim !== null ? '<button class="theme-btn" id="limpar">Ver todas as dimensões</button>' : ''}</div>${itens.join('') || '<p class="muted">Nenhum achado com esse filtro.</p>'}`;
  const b = $('#limpar'); if (b) b.onclick = () => { filtroDim = null; marcarDims(); listaAchados(); };
}
function marcarDims() { document.querySelectorAll('.dim').forEach((el) => el.setAttribute('aria-expanded', String(Number(el.dataset.dim) === filtroDim))); }

function matriz() {
  let cel = '';
  for (let imp = 2; imp >= 0; imp--) for (let esf = 0; esf <= 2; esf++) {
    const pts = d.oportunidades.map((o, i) => ({ o, i })).filter(({ o }) => NIV[o.impacto] === imp && NIV[o.esforco] === esf);
    cel += `<div class="q ${imp === 2 && esf === 0 ? 'ouro' : ''}">${pts.map(({ o, i }) => `<span class="ponto" data-op="${i}" data-tip="<b>${i + 1}. ${esc(o.titulo)}</b>impacto ${NIVTXT[o.impacto]} · esforço ${NIVTXT[o.esforco]}">${i + 1}</span>`).join('')}${imp === 2 && esf === 0 ? '<small>ganho rápido</small>' : ''}</div>`;
  }
  return `<div class="matriz-wrap"><div class="eixo-y">impacto →</div><div class="matriz">${cel}</div><div class="eixo-x">esforço →</div></div>`;
}

function oportunidades() {
  return d.oportunidades.map((o, i) => `<div class="card op" data-op="${i}"><span class="n">${i + 1}</span><div>
      <h3>${esc(o.titulo)}</h3>
      <div class="meta"><span>impacto ${NIVTXT[o.impacto]}</span><span>esforço ${NIVTXT[o.esforco]}</span><span>métrica: ${esc(o.metrica)}</span></div>
      <p class="ganho">${esc(o.ganho)}</p><p class="conta">${esc(o.conta)}</p></div></div>`).join('');
}

$('#app').innerHTML = `
<header class="top">
  <div>
    <div class="eyebrow">Diagnóstico assistido por IA · 8 dimensões</div>
    <h1>Diagnóstico da suíte E2E</h1>
    <p class="sub">Banco Demo · WebdriverIO v9 · ${D.runs} execuções reais sem retry · gerado em ${new Date(D.geradoEm).toLocaleString('pt-BR', { dateStyle: 'short', timeStyle: 'short' })}</p>
  </div>
  <button class="theme-btn" id="tema" aria-label="Alternar tema claro/escuro">◐ Tema</button>
</header>
<p class="resumo">${esc(d.resumoExecutivo)}</p>

<div class="grid kpis">${kpis.map((k) => `<div class="card kpi"><div class="rotulo">${k.rotulo}</div><div class="valor">${k.valor}</div>${k.st ? `<span class="status st-${k.st}">${ROT[k.st]}</span> ` : ''}<span class="muted">${k.det}</span></div>`).join('')}</div>
${d.destaques.length ? `<div class="grid destaques">${d.destaques.map((x) => `<div class="card destaque"><div class="rotulo muted">${esc(x.rotulo)} ${tipo(x.tipo || 'fato')}</div><div class="valor">${esc(x.valor)}</div><p class="sub" style="font-size:13px">${esc(x.detalhe || '')}</p><p class="ev">${esc(x.evidencia || '')}</p></div>`).join('')}</div>` : ''}

<section>
  <div class="sec-head"><div><h2>Estabilidade real</h2><p class="sub">Cada linha é um teste; cada coluna, uma execução completa da suíte sem retry.</p></div><span class="muted">fonte: historico/run-*/ (JUnit)</span></div>
  <div class="card">${heatmap()}</div>
</section>

<section class="grid duo">
  <div class="card"><h2>Duração por execução</h2><p class="muted" style="margin-bottom:8px">segundos · ✓ verde / ✕ vermelha · fonte: historico/execucoes.json</p>${graficoDuracao()}</div>
  <div class="card"><h2>Espera fixa no código</h2><p class="muted" style="margin-bottom:8px">segundos de <code>browser.pause</code> escritos por arquivo · ${n1(totalPausas / 1000)} s no total · fonte: test/specs/</p>${pausas()}</div>
</section>

<section>
  <div class="sec-head"><div><h2>Semáforo das 8 dimensões</h2><p class="sub">Clique numa dimensão para ver os achados e as evidências.</p></div>
    <div class="filtros" role="group" aria-label="Filtrar achados">
      <button data-f="todos" aria-pressed="true">Todos (${totalAchados})</button><button data-f="fato" aria-pressed="false">Fatos (${qtdTipo('fato')})</button><button data-f="inferencia" aria-pressed="false">Inferências (${qtdTipo('inferencia')})</button>
    </div></div>
  <div class="grid dims">${dimensoes()}</div>
  <div class="card achados" id="achados"></div>
</section>

<section>
  <div class="sec-head"><div><h2>Top 5 oportunidades</h2><p class="sub">Impacto × esforço, com a métrica que deve mudar e a conta do ganho.</p></div></div>
  <div class="grid duo" style="grid-template-columns: 0.8fr 1.2fr; align-items:start">
    <div class="card">${matriz()}</div>
    <div class="ops">${oportunidades()}</div>
  </div>
</section>

<section>
  <div class="sec-head"><div><h2>POC recomendada · 4 dias</h2><p class="sub">${esc(d.poc.escopo)}</p></div></div>
  <div class="grid dias">${d.poc.dias.map((x, i) => `<div class="card dia"><div class="d">Dia ${i + 1}</div><p>${esc(x.foco || x)}</p></div>`).join('')}</div>
  <h3 style="margin:22px 0 10px">Critério de sucesso</h3>
  <div class="grid crit">${d.poc.criterios.map((c) => `<div class="card"><div class="muted">${esc(c.metrica)}</div><div><span class="de">${esc(c.atual)}</span><span class="seta">→</span><span class="para">${esc(c.meta)}</span></div></div>`).join('')}</div>
  ${d.poc.riscos.length ? `<div class="card" style="margin-top:14px"><h3>Riscos</h3><ul class="riscos">${d.poc.riscos.map((x) => `<li>${esc(x)}</li>`).join('')}</ul></div>` : ''}
</section>

<footer>Os números de execução, estabilidade e pausas são medidos direto do histórico e do código. Textos, semáforo e oportunidades vêm do diagnóstico da IA (${esc(D.fonte)}). <b>Fato</b> = verificado na evidência citada; <b>Inferência</b> = dedução a confirmar pelo engenheiro.</footer>`;

marcarDims(); listaAchados();
document.querySelectorAll('.dim').forEach((el) => el.onclick = () => {
  const i = Number(el.dataset.dim); filtroDim = filtroDim === i ? null : i; marcarDims(); listaAchados();
});
document.querySelectorAll('.filtros button').forEach((b) => b.onclick = () => {
  filtroTipo = b.dataset.f; document.querySelectorAll('.filtros button').forEach((x) => x.setAttribute('aria-pressed', String(x === b))); listaAchados();
});
document.querySelectorAll('[data-op]').forEach((el) => {
  const on = (v) => document.querySelectorAll(`[data-op="${el.dataset.op}"]`).forEach((x) => x.classList.toggle('ativo', v));
  el.addEventListener('mouseenter', () => on(true)); el.addEventListener('mouseleave', () => on(false));
});
$('#tema').onclick = () => {
  const html = document.documentElement;
  const escuro = html.dataset.theme ? html.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  html.dataset.theme = escuro ? 'light' : 'dark';
};
const tip = $('#tip');
document.addEventListener('mousemove', (e) => {
  const alvo = e.target.closest('[data-tip]');
  if (!alvo) { tip.style.opacity = 0; return; }
  tip.innerHTML = alvo.dataset.tip; tip.style.opacity = 1;
  const x = Math.min(e.clientX + 14, innerWidth - tip.offsetWidth - 8), y = e.clientY + 16 + tip.offsetHeight > innerHeight ? e.clientY - tip.offsetHeight - 10 : e.clientY + 16;
  tip.style.left = x + 'px'; tip.style.top = y + 'px';
});
</script>
</body>
</html>

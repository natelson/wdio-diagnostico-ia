<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><title>Banco Demo · Início</title><link rel="stylesheet" href="estilo.css"></head>
<body>
<header><strong>Banco Demo</strong><nav><span id="saudacao"></span><a href="cartao.html" data-testid="menu-cartao">Meu cartão</a><a href="fatura.html" data-testid="menu-fatura">Fatura</a></nav></header>
<main>
  <div class="cartao" id="resumo"><p class="carregando">Carregando resumo...</p></div>
</main>
<script src="app.js"></script>
<script>
  exigirLogin();
  (async () => {
    const [{ dados: c }, { dados: f }] = await Promise.all([api('cartao'), api('fatura')]);
    document.querySelector('#resumo').innerHTML = `
      <h2>Resumo</h2>
      <p>Cartão ${c.bandeira} final <span data-testid="cartao-final">${c.final}</span></p>
      <p>Fatura ${f.competencia}: <strong data-testid="fatura-total">${brl(f.total)}</strong></p>`;
  })();
</script>
<div id="aviso-estatico" style="position:fixed;left:12px;bottom:12px;z-index:9;font:13px system-ui,sans-serif;background:#1d233c;color:#fff;padding:8px 12px;border-radius:8px;opacity:.92">
  Versão publicada: a API roda simulada no navegador. Login: 123.456.789-09 / demo123 ·
  <a href="#" style="color:#9fd" onclick="localStorage.removeItem('bancoDemo:estado');location.reload();return false">reiniciar dados</a></div>
</body>
</html>
